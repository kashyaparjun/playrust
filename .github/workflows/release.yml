name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} && rustup default stable
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          asset="playrust-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
          mkdir -p dist package
          cp "target/${{ matrix.target }}/release/playrust" README.md package/
          tar -C package -czf "dist/$asset" playrust README.md
          cd dist
          shasum -a 256 "$asset" > "$asset.sha256"
      - name: Package archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $asset = "playrust-$env:GITHUB_REF_NAME-${{ matrix.target }}.zip"
          New-Item -ItemType Directory -Force dist, package
          Copy-Item -Path "target/${{ matrix.target }}/release/playrust.exe", "README.md" -Destination package
          Compress-Archive -Path package/playrust.exe, package/README.md -DestinationPath "dist/$asset"
          Set-Location dist
          "{0}  {1}" -f (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower(), $asset | Set-Content "$asset.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: playrust-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Upload release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Upload assets to existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
