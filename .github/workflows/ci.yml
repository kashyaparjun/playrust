name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.89
        run: rustup toolchain install 1.89 --profile minimal && rustup default 1.89
      - name: Check MSRV
        run: cargo check --all-features --locked

  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test all features
        run: cargo test --all-features --locked
      - name: Clippy
        run: cargo clippy --all-features --all-targets --locked -- -D warnings

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/playrust
            target
          key: browser-smoke-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Install video tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install pinned Chromium
        run: cargo run --locked -- browser install
      - name: Run browser, video, and visual tests
        env:
          PLAYRUST_CHROME: /home/runner/.cache/playrust/chrome-for-testing/151.0.7922.34/linux64/chrome-linux64/chrome
          PLAYRUST_FFMPEG: /usr/bin/ffmpeg
          PLAYRUST_NO_SANDBOX: "1"
        run: >-
          cargo test --locked
          --test browser_smoke
          --test visual_assertion_e2e
          --test advanced_selectors_e2e
          --test flow_control_e2e
          --test frames_e2e
          --test http_e2e
          --test long_press_e2e
          --test pause_e2e
          --test recording_controls_e2e
          --test scripting_e2e
          --test session_e2e
          --test scroll_until_visible_e2e
          --test storage_clearing_e2e
          --test swipe_e2e
          --test tab_selection_e2e
          --test tabs_e2e
          --test wait_until_stable_e2e
          --test wait_until_visible_e2e
          --test open_settle_e2e
          --test secret_recording_warning_e2e
          --test session_error_handling_e2e
          -- --ignored --test-threads=1
      - name: Run pause cancellation test
        env:
          PLAYRUST_CHROME: /home/runner/.cache/playrust/chrome-for-testing/151.0.7922.34/linux64/chrome-linux64/chrome
          PLAYRUST_NO_SANDBOX: "1"
        run: >-
          cargo test --locked --lib
          cancelling_an_in_flight_compiled_pause_interrupts_the_flow
          -- --ignored
