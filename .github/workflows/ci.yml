name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test all features
        run: cargo test --all-features --locked
      - name: Clippy
        run: cargo clippy --all-features --all-targets --locked -- -D warnings

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/playrust
            target
          key: browser-smoke-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Install video tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install pinned Chromium
        run: cargo run --locked -- browser install
      - name: Run browser, video, and visual tests
        env:
          PLAYRUST_CHROME: /home/runner/.cache/playrust/chrome-for-testing/151.0.7922.34/linux64/chrome-linux64/chrome
          PLAYRUST_FFMPEG: /usr/bin/ffmpeg
        run: >-
          cargo test --locked
          --test browser_smoke
          --test visual_assertion_e2e
          --test advanced_selectors_e2e
          -- --ignored
