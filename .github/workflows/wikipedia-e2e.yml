name: Wikipedia E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  wikipedia:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/playrust
            target
          key: wikipedia-e2e-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Install video tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install pinned Chromium
        run: cargo run --locked -- browser install
      - name: Run Wikipedia E2E
        env:
          PLAYRUST_FFMPEG: /usr/bin/ffmpeg
          PLAYRUST_FFPROBE: /usr/bin/ffprobe
          PLAYRUST_LIVE_E2E: "1"
          PLAYRUST_REQUIRE_BROWSER: "1"
        run: >-
          cargo test --locked
          --test wikipedia_search_e2e
          --test wikipedia_navigation_e2e
          --test wikipedia_failure_e2e
          -- --test-threads=1 --show-output
