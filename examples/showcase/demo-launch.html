<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <style>
      * { box-sizing: border-box; }
      body { width: 1280px; height: 720px; margin: 0; display: grid; place-items: center; overflow: hidden; background: #111816; color: #f6f0df; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      main { width: 980px; }
      .eyebrow { color: #ff6840; font-size: 13px; letter-spacing: 3px; text-transform: uppercase; }
      h1 { margin: 18px 0 44px; font: 700 66px/0.95 Georgia, serif; }
      .terminal { border: 1px solid #526159; background: #18211d; box-shadow: 12px 12px 0 #080c0a; }
      .bar { height: 42px; padding: 12px 16px; border-bottom: 1px solid #526159; color: #95a198; font-size: 12px; }
      pre { margin: 0; padding: 26px; font-size: 18px; line-height: 1.8; }
      .prompt { color: #ff6840; }
      .ok { color: #b9d788; }
      .status { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 24px; }
      .status div { padding: 16px; border: 1px solid #526159; color: #aeb9b2; }
      .status strong { display: block; margin-top: 6px; color: #f6f0df; font-size: 18px; }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">02 / Render the application</div>
      <h1>Launch Chromium.<br>Run the flow.</h1>
      <div class="terminal">
        <div class="bar">playrust / terminal</div>
        <pre><span class="prompt">$</span> playrust run examples/showcase/04-full-demo.yaml
<span class="ok">✓</span> YAML validated
<span class="ok">✓</span> Chromium 151 ready
<span class="ok">✓</span> Recording started</pre>
      </div>
      <div class="status"><div>Browser<strong>Chromium</strong></div><div>Viewport<strong>960 × 720</strong></div><div>Mode<strong>Headless + video</strong></div></div>
    </main>
  </body>
</html>
