[package]
name = "playrust"
version = "0.2.1"
edition = "2024"
rust-version = "1.89"
description = "Chromium browser runtime for AI agents with audited, secret-safe, replayable sessions"
repository = "https://github.com/kashyaparjun/playrust"
homepage = "https://github.com/kashyaparjun/playrust"

[dependencies]
anyhow = "1"
async-tungstenite = { version = "0.32", features = ["tokio-runtime"] }
base64 = "0.22"
chrome-for-testing = "=0.4.0"
chrome-for-testing-manager = { version = "=0.12.0", default-features = false }
chromiumoxide = "0.9.1"
clap = { version = "4", features = ["derive"] }
directories = "6"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = "0.0.29"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
flate2 = "1"
tar = "0.4"
zip = "4"
tokio = { version = "1", features = ["full"] }
url = "2"

[dev-dependencies]
libtest-mimic = "0.8"

[[test]]
name = "advanced_selectors_e2e"
harness = false

[[test]]
name = "browser_prerequisites_e2e"
harness = false

[[test]]
name = "browser_smoke"
harness = false

[[test]]
name = "flow_control_e2e"
harness = false

[[test]]
name = "frames_e2e"
harness = false

[[test]]
name = "http_e2e"
harness = false

[[test]]
name = "long_press_e2e"
harness = false

[[test]]
name = "pause_e2e"
harness = false

[[test]]
name = "recording_controls_e2e"
harness = false

[[test]]
name = "scripting_e2e"
harness = false

[[test]]
name = "scroll_until_visible_e2e"
harness = false

[[test]]
name = "session_e2e"
harness = false

[[test]]
name = "storage_clearing_e2e"
harness = false

[[test]]
name = "swipe_e2e"
harness = false

[[test]]
name = "tab_selection_e2e"
harness = false

[[test]]
name = "tabs_e2e"
harness = false

[[test]]
name = "visual_assertion_e2e"
harness = false

[[test]]
name = "wait_until_stable_e2e"
harness = false

[[test]]
name = "wait_until_visible_e2e"
