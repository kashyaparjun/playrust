[package]
name = "playrust"
version = "0.2.1"
edition = "2024"
rust-version = "1.89"
description = "Chromium browser runtime for AI agents with audited, secret-safe, replayable sessions"
repository = "https://github.com/kashyaparjun/playrust"
homepage = "https://github.com/kashyaparjun/playrust"

[dependencies]
anyhow = "1"
async-tungstenite = { version = "0.32", features = ["tokio-runtime"] }
base64 = "0.22"
chrome-for-testing = "=0.4.0"
chrome-for-testing-manager = { version = "=0.12.0", default-features = false }
chromiumoxide = "0.9.1"
clap = { version = "4", features = ["derive"] }
directories = "6"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
# Pin exact 0.0.x: serde-saphyr is the untrusted YAML boundary. Bumps require a
# changelog review, the existing suite, and `cargo update -p serde-saphyr --precise`.
serde-saphyr = "=0.0.29"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
flate2 = "1"
tar = "0.4"
zip = "4"
tokio = { version = "1", features = ["full"] }
url = "2"
